name: Update Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/update-changelog*'
      - '.github/workflows/update-changelog.yml'

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event_name == 'pull_request' && github.ref || 'releases' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test changelog generation
        run: node --test .github/scripts/update-changelog.test.cjs

  update:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the changelog deploy key
        env:
          CHANGELOG_DEPLOY_KEY: ${{ secrets.CHANGELOG_DEPLOY_KEY }}
        run: |
          if [ -z "$CHANGELOG_DEPLOY_KEY" ]; then
            echo "::error::Configure the CHANGELOG_DEPLOY_KEY repository secret."
            exit 1
          fi

      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}

      - name: Add missing published releases
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { updateChangelog } = require('./.github/scripts/update-changelog.cjs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100,
            });
            const file = 'CHANGELOG.md';
            fs.writeFileSync(file, updateChangelog(fs.readFileSync(file, 'utf8'), releases));

      - name: Commit the changelog to the default branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.repository.default_branch }}
          file_pattern: CHANGELOG.md
          commit_message: 'docs: update changelog from published releases'
