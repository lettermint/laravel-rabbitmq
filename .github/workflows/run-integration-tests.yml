name: run-integration-tests

on:
  push:
    paths:
      - '**.php'
      - 'tests/Integration/**'
      - '.github/workflows/run-integration-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - 'tests/Integration/**'
      - '.github/workflows/run-integration-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        php: [8.5]
        laravel: [13.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: Integration Tests - P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, posix, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, amqp, sockets
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Require Laravel Framework and Testbench versions
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Require Pest 4 packages
        run: |
          composer require "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" "pestphp/pest-plugin-arch:^4.0" --dev --no-interaction --no-update

      - name: Install all dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Start the required three-broker cluster
        run: docker compose -f tests/Integration/docker/compose.yaml up -d --wait --wait-timeout 120

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute integration tests
        env:
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: 25672
          RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:25673
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
          RABBITMQ_VHOST: /
        run: vendor/bin/pest --ci --group=integration

      - name: Capture broker evidence
        if: always()
        run: |
          docker compose -f tests/Integration/docker/compose.yaml ps
          docker compose -f tests/Integration/docker/compose.yaml logs --no-color > broker-test.log

      - name: Upload broker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-test-evidence
          path: broker-test.log
          retention-days: 7

      - name: Remove isolated test volumes
        if: always()
        run: docker compose -f tests/Integration/docker/compose.yaml down --volumes
