name: PHPStan

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - '.github/workflows/phpstan.yml'

env:
  # Composer 2.9+ refuses to install versions with security advisories, abandoned
  # packages and (2.11+) releases still in their cooldown period. The matrix must
  # install every supported Laravel version, and prefer-lowest must install the
  # real lowest versions, so CI turns that blocking off. COMPOSER_NO_BLOCKING is
  # the 2.11+ name; COMPOSER_NO_SECURITY_BLOCKING covers 2.9 and 2.10.
  COMPOSER_NO_BLOCKING: 1
  COMPOSER_NO_SECURITY_BLOCKING: 1

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
